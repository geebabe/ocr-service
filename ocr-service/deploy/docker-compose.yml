version: "3.8"

services:
  ocr-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - VLLM_URL=http://qwen-model:8000/v1/chat/completions
      - VLLM_MODEL=${MODEL_ID:-erax-ai/EraX-VL-7B-V1.0}
    depends_on:
      qwen-model:
        condition: service_healthy
    networks:
      - ocr-network

  qwen-model:
    image: vllm/vllm-openai:latest
    environment:
      - HF_TOKEN
      - MODEL_ID=${MODEL_ID:-erax-ai/EraX-VL-7B-V1.0}
    command: >
      --model ${MODEL_ID:-erax-ai/EraX-VL-7B-V1.0}
      --max-model-len 8192
      --max-num-batched-tokens 4096
      --gpu-memory-utilization 0.9
      --trust-remote-code
      --enforce-eager
      --tensor-parallel-size 1
    shm_size: '8gb'
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
