version: "3.8"

services:
  ocr-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - VLLM_URL=http://qwen-model:8000/v1/chat/completions
    depends_on:
      qwen-model:
        condition: service_healthy
    networks:
      - ocr-network

  qwen-model:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen3-VL-2B-Instruct
      --max-model-len 8192
      --gpu-memory-utilization 0.8
      --trust-remote-code
    environment:
      - HF_TOKEN
    shm_size: '4gb'
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
