version: "3.8"

services:
  ocr-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VLLM_URL=http://qwen-model:8000/v1/chat/completions
      - VLLM_MODEL=${MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      - PADDLEOCR_URL=http://paddleocr-service:8000/extract
    depends_on:
      qwen-model:
        condition: service_healthy
      paddleocr-service:
        condition: service_healthy
    networks:
      - ocr-network

  paddleocr-service:
    build:
      context: ../../paddleocr-service
      dockerfile: ../ocr-service/deploy/Dockerfile.paddleocr
    restart: unless-stopped
    environment:
      - OMP_NUM_THREADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "8002:8000"
    networks:
      - ocr-network

  qwen-model:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    environment:
      - HF_TOKEN
      - MODEL_ID=${MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
    command: >
      --model ${MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      --max-model-len 16384
      --max-num-batched-tokens 16384
      --gpu-memory-utilization 0.9
      --trust-remote-code
      --enforce-eager
      --tensor-parallel-size 1
    shm_size: '8gb'
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
